<!doctype html><meta charset="utf-8"><title>output</title>
<!-- media.html?src=<path under out/> : plays an exported MP4 or GIF -->
<style>html,body{margin:0;height:100%;background:#1e1e2e;color:#e6e6e6;font:22px -apple-system,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
video,img{max-width:94vw;max-height:78vh;border-radius:8px}</style>
<div id="label"></div>
<script>
const src = new URLSearchParams(location.search).get("src");
document.getElementById("label").textContent = src ? `out/${src}` : "?src=<file under out/> is missing";
if (src) {
  const el = document.body.appendChild(document.createElement(src.endsWith(".gif") ? "img" : "video"));
  Object.assign(el, { src: `/out/${encodeURI(src)}`, autoplay: true, muted: true, playsInline: true });
}
</script>
