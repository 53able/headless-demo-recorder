<!doctype html><meta charset="utf-8"><title>inspect-sheet</title>
<!-- sheet.html?src=<path under out/>&rows=<n>&n=<tiles> : an inspect sheet (4 tiles per row) re-laid as a 2-column grid -->
<style>html,body{margin:0;height:100%;background:#1e1e2e;color:#e6e6e6;font:22px -apple-system,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.grid{display:grid;grid-template-columns:repeat(2,520px);gap:12px}
.t{width:520px;height:290px;border-radius:6px;background-repeat:no-repeat}</style>
<div id="label"></div><div class="grid"></div>
<script>
const q = new URLSearchParams(location.search);
const src = q.get("src");
const cols = 4; // inspect.ts puts 4 tiles in a row
const rows = Math.max(1, Number(q.get("rows")) || 1);
const n = Math.min(cols * rows, Number(q.get("n")) || cols * rows);
document.getElementById("label").textContent = src ? `out/${src}（1 アクション 1 コマ）` : "?src=<file under out/> is missing";
const pct = (i, of) => (of > 1 ? (i / (of - 1)) * 100 : 0);
const grid = document.querySelector(".grid");
for (let i = 0; src && i < n; i++) {
  const t = grid.appendChild(document.createElement("div"));
  t.className = "t";
  t.style.backgroundImage = `url("/out/${encodeURI(src)}")`;
  t.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
  t.style.backgroundPosition = `${pct(i % cols, cols)}% ${pct(Math.floor(i / cols), rows)}%`;
}
</script>
